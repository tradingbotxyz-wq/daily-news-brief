# One-click deploy on Render's FREE plan.
# Data (subscribers, briefs, push keys) is stored in a free Turso database,
# because free Render instances lose local files whenever they restart.
services:
  - type: web
    name: daily-news-brief
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: SECURE_COOKIES
        value: "true"
      - key: INGEST_API_KEY
        generateValue: true
      - key: PREMIUM_PRICE_PAISE
        value: "9900"
      - key: PREMIUM_DAYS
        value: "30"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
